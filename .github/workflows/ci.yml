name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Enables the database integration tests (they are reported as skipped without it).
      HEALTHOS_TEST_PG_ADMIN: Host=localhost;Port=5432;Username=postgres;Password=ci-only-admin;Database=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore (locked)
        run: dotnet restore HealthOS.slnx --locked-mode
      - name: Build (warnings as errors, NuGet audit)
        run: dotnet build HealthOS.slnx --no-restore -c Release
        env:
          CI: "true"
      - name: Test (unit, host, architecture, database integration)
        shell: bash
        run: |
          set -o pipefail
          dotnet test --solution HealthOS.slnx --no-build -c Release 2>&1 | tee dotnet-test.txt
      - name: Publish .NET test totals
        if: always()
        shell: bash
        run: |
          grep -E '^\s+(total|succeeded|failed|skipped):' dotnet-test.txt | tr -s ' ' | paste -sd ' ' | sed 's/^/::notice title=.NET tests::/' || true
          grep -E 'not executed|Skipped' dotnet-test.txt | head -5 | sed 's/^/::warning title=.NET skipped::/' || true

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.14
      - run: uv sync --locked
      - run: uv run ruff check .
      - name: Type check (mypy strict)
        shell: bash
        run: |
          status=0
          uv run mypy src > mypy.txt 2>&1 || status=$?
          cat mypy.txt
          # Surface errors as annotations (visible on the run page and via the public API).
          sed -nE 's#^([^:]+):([0-9]+): error: (.*)$#::error file=services/ai-service/\1,line=\2,title=mypy::\3#p' mypy.txt
          exit $status
      - run: uv run pytest --junitxml=pytest.xml
      - name: Dependency audit
        run: uv export --no-dev --no-emit-project --format requirements-txt > requirements.txt && uv run pip-audit -r requirements.txt --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-service-test-results
          path: services/ai-service/pytest.xml

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter @healthos/admin-web build
      - run: pnpm audit --audit-level moderate

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: SBOM (CycloneDX via syft)
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
