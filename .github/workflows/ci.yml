name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Enables the database integration tests (they are reported as skipped without it).
      HEALTHOS_TEST_PG_ADMIN: Host=localhost;Port=5432;Username=postgres;Password=ci-only-admin;Database=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore (locked)
        run: dotnet restore HealthOS.slnx --locked-mode
      - name: Build (warnings as errors, NuGet audit)
        run: dotnet build HealthOS.slnx --no-restore -c Release
        env:
          CI: "true"
      - name: Test (unit, host, architecture, database integration)
        shell: bash
        run: |
          set -o pipefail
          dotnet test --solution HealthOS.slnx --no-build -c Release 2>&1 | tee dotnet-test.txt
      - name: Publish .NET test totals
        if: always()
        shell: bash
        run: |
          clean=$(sed -r 's/\x1B\[[0-9;?]*[A-Za-z]//g; s/\r//g' dotnet-test.txt)
          echo "$clean" | grep -E '(total|succeeded|failed|skipped):' | sed -E 's/^\s+//; s/^/::notice title=.NET tests::/' || true
          echo "$clean" | grep -E '\.dll \(net10\.0' | sed -E 's#^.*/##; s/^/::notice title=.NET assembly::/' || true
          echo "$clean" | grep -E 'not executed' | head -5 | sed -E 's/^\s+//; s/^/::warning title=.NET skipped::/' || true

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.14
      - run: uv sync --locked
      - run: uv run ruff check .
      - name: Type check (mypy strict)
        shell: bash
        run: |
          status=0
          uv run mypy src > mypy.txt 2>&1 || status=$?
          cat mypy.txt
          # Surface errors as annotations (visible on the run page and via the public API).
          sed -nE 's#^([^:]+):([0-9]+): error: (.*)$#::error file=services/ai-service/\1,line=\2,title=mypy::\3#p' mypy.txt
          exit $status
      - run: uv run pytest --junitxml=pytest.xml
      - name: Dependency audit
        run: uv export --no-dev --no-emit-project --format requirements-txt > requirements.txt && uv run pip-audit -r requirements.txt --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-service-test-results
          path: services/ai-service/pytest.xml

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter @healthos/admin-web build
      - run: pnpm audit --audit-level moderate

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: SBOM (CycloneDX via syft)
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  # Full local stack (deploy/local/compose.yaml) + real browser login through Keycloak and the BFF.
  e2e:
    runs-on: ubuntu-latest
    needs: [dotnet, web]
    env:
      CORE_API_DLL: services/core-api/src/HealthOS.CoreApi/bin/Release/net10.0/HealthOS.CoreApi.dll
      COMPOSE: docker compose --env-file .env -f deploy/local/compose.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Generate throwaway secrets (.env)
        run: |
          r() { openssl rand -hex 24; }
          {
            echo "HOS_PG_SUPERUSER_PASSWORD=$(r)"
            echo "HOS_MIGRATOR_PASSWORD=$(r)"
            echo "HOS_APP_PASSWORD=$(r)"
            echo "HOS_KEYCLOAK_ADMIN_PASSWORD=$(r)"
            echo "HOS_BFF_CLIENT_SECRET=$(r)"
            echo "HOS_DEV_USER_PASSWORD=Dev-$(r)"
          } > .env
          while IFS='=' read -r _ v; do echo "::add-mask::$v"; done < .env

      - name: Start stack (postgres, keycloak, jaeger, mailpit)
        run: $COMPOSE up -d --wait --wait-timeout 300

      - name: Build core-api
        run: dotnet build services/core-api/src/HealthOS.CoreApi -c Release

      - name: Database bootstrap and migrate (run twice to prove idempotency)
        run: |
          set -a; . ./.env; set +a
          PG="Host=localhost;Port=5433"
          export Database__AdminConnectionString="$PG;Database=postgres;Username=hos_superuser;Password=$HOS_PG_SUPERUSER_PASSWORD"
          export Database__MigratorPassword="$HOS_MIGRATOR_PASSWORD" Database__AppPassword="$HOS_APP_PASSWORD"
          export Database__MigratorConnectionString="$PG;Database=healthos;Username=hos_migrator;Password=$HOS_MIGRATOR_PASSWORD"
          for i in 1 2; do dotnet $CORE_API_DLL db bootstrap && dotnet $CORE_API_DLL db migrate; done

      - name: Start core-api and admin-web
        run: |
          set -a; . ./.env; set +a
          export ASPNETCORE_ENVIRONMENT=Development ASPNETCORE_URLS=http://localhost:5080
          export Database__ConnectionString="Host=localhost;Port=5433;Database=healthos;Username=hos_app;Password=$HOS_APP_PASSWORD"
          export Authentication__Oidc__ClientSecret="$HOS_BFF_CLIENT_SECRET"
          nohup dotnet $CORE_API_DLL > core-api.log 2>&1 &
          nohup pnpm --filter @healthos/admin-web dev > admin-web.log 2>&1 &
          for i in $(seq 60); do curl -fs http://localhost:5080/health/ready >/dev/null && break; sleep 2; done
          for i in $(seq 60); do curl -fs http://localhost:5173/ >/dev/null && break; sleep 2; done
          curl -fsS http://localhost:5080/health/ready && echo

      - run: pnpm --filter @healthos/e2e exec playwright install --with-deps chromium

      - name: Playwright login journey
        run: |
          set -a; . ./.env; set +a
          E2E_PASSWORD="$HOS_DEV_USER_PASSWORD" pnpm --filter @healthos/e2e e2e

      - name: Verify user was provisioned in core_identity
        run: |
          n=$($COMPOSE exec -T postgres psql -U hos_superuser -d healthos -tAc "select count(*) from core_identity.user_account")
          echo "::notice title=E2E provisioning::core_identity.user_account rows = $n"
          test "$n" = "1"

      - name: Diagnostics
        if: failure()
        run: |
          echo "--- core-api"; tail -n 80 core-api.log || true
          echo "--- admin-web"; tail -n 40 admin-web.log || true
          echo "--- compose ps"; $COMPOSE ps || true
          echo "--- keycloak"; $COMPOSE logs --tail 60 keycloak || true
          grep -hiE '"LogLevel":"(Error|Critical|Warning)"|exception' core-api.log | head -8 | cut -c1-900 | sed 's/^/::error title=core-api::/' || true
          $COMPOSE logs --no-color keycloak 2>/dev/null | grep -iE 'error|warn|invalid' | tail -8 | cut -c1-500 | sed 's/^/::warning title=keycloak::/' || true
          $COMPOSE ps --format '{{.Service}} {{.State}} {{.Health}}' | sed 's/^/::notice title=compose::/' || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
