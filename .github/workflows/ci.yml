name: ci

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Enables the database integration tests (they are reported as skipped without it).
      HEALTHOS_TEST_PG_ADMIN: Host=localhost;Port=5432;Username=postgres;Password=ci-only-admin;Database=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore (locked)
        run: dotnet restore HealthOS.slnx --locked-mode
      - name: Build (warnings as errors, NuGet audit)
        run: dotnet build HealthOS.slnx --no-restore -c Release
        env:
          CI: "true"
      - name: Test (unit, host, architecture, database integration)
        shell: bash
        run: |
          set -o pipefail
          dotnet test --solution HealthOS.slnx --no-build -c Release 2>&1 | tee dotnet-test.txt
      - name: Publish .NET test totals
        if: always()
        shell: bash
        run: |
          clean=$(sed -r 's/\x1B\[[0-9;?]*[A-Za-z]//g; s/\r//g' dotnet-test.txt)
          echo "$clean" | grep -E '(total|succeeded|failed|skipped):' | sed -E 's/^\s+//; s/^/::notice title=.NET tests::/' || true
          echo "$clean" | grep -E '\.dll \(net10\.0' | sed -E 's#^.*/##; s/^/::notice title=.NET assembly::/' || true
          echo "$clean" | grep -E 'not executed' | head -5 | sed -E 's/^\s+//; s/^/::warning title=.NET skipped::/' || true
          # One annotation per failed test: name plus the first lines of its error.
          echo "$clean" | awk '
            /^[[:space:]]*failed [A-Za-z]/ { if (msg != "") print msg; msg = $0; n = 0; next }
            msg != "" && n < 6 { gsub(/^[[:space:]]+/, ""); if (length($0) > 0) { msg = msg " | " $0; n++ } }
            END { if (msg != "") print msg }' | head -30 | cut -c1-1200 | sed -E 's/^[[:space:]]+//; s/^/::error title=.NET test failed::/' || true

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.14
      - run: uv sync --locked
      - run: uv run ruff check .
      - name: Type check (mypy strict)
        shell: bash
        run: |
          status=0
          uv run mypy src > mypy.txt 2>&1 || status=$?
          cat mypy.txt
          # Surface errors as annotations (visible on the run page and via the public API).
          sed -nE 's#^([^:]+):([0-9]+): error: (.*)$#::error file=services/ai-service/\1,line=\2,title=mypy::\3#p' mypy.txt
          exit $status
      - run: uv run pytest --junitxml=pytest.xml
      - name: Dependency audit
        run: uv export --no-dev --no-emit-project --format requirements-txt > requirements.txt && uv run pip-audit -r requirements.txt --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-service-test-results
          path: services/ai-service/pytest.xml

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter @healthos/admin-web build
      - run: pnpm audit --audit-level moderate

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: SBOM (CycloneDX via syft)
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  # Each product bundle builds alone and contains only its own product modules (spec §2/§9 M3, M9).
  bundles:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bundle: [careops, clinicos, dental-clinic, eye-clinic, medtech]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build bundle
        # Lock files describe the default (full) bundle; other bundles restore without them.
        run: dotnet build services/core-api/src/HealthOS.CoreApi -c Release -p:HealthOSBundle=${{ matrix.bundle }} -p:RestoreLockedMode=false -o out
      - name: Package contains exactly the bundle's product modules
        shell: bash
        run: |
          expected=$(sed -n 's:.*<HealthOSBundleModules>\(.*\)</HealthOSBundleModules>.*:\1:p' deploy/bundles/${{ matrix.bundle }}.props | tr ';' '\n' | sort)
          actual=$(cd out && dotnet HealthOS.CoreApi.dll modules list | grep -v '^core\.' | sort)
          echo "expected: $expected"; echo "actual: $actual"
          if [ "$expected" != "$actual" ]; then echo "::error title=bundle ${{ matrix.bundle }}::expected [$expected] got [$actual]"; exit 1; fi
          # No assemblies of other products may ship in this package.
          declare -A asm=( [careops.quality]=HealthOS.CareOps.Quality [clinicos.core]=HealthOS.ClinicOS.Core
                           [specialty.dental]=HealthOS.Specialty.Dental [specialty.vision]=HealthOS.Specialty.Vision
                           [medtechos.assets]=HealthOS.MedTechOS.Assets )
          for id in "${!asm[@]}"; do
            if [ -f "out/${asm[$id]}.dll" ] && ! grep -qx "$id" <<< "$expected"; then
              echo "::error title=bundle ${{ matrix.bundle }}::unexpected assembly ${asm[$id]}.dll"; exit 1
            fi
          done
          echo "::notice title=bundle ${{ matrix.bundle }}::$(echo $actual | tr '\n' ' ')"

  # Full local stack + real browser logins, using the same scripts as Codespaces (scripts/dev-*.sh),
  # so those scripts are verified on every push.
  e2e:
    runs-on: ubuntu-latest
    needs: [dotnet, web]
    env:
      COMPOSE: docker compose --env-file .env -f deploy/local/compose.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Start everything (scripts/dev-start.sh)
        run: bash scripts/dev-start.sh

      - name: Database setup is idempotent (second run)
        run: DEV_UP_SKIP_BUILD=1 bash scripts/dev-up.sh

      - run: pnpm --filter @healthos/e2e exec playwright install --with-deps chromium

      - name: Playwright login journeys (password, and password + one-time code)
        run: |
          set -a; . ./.env; set +a
          E2E_PASSWORD="$HOS_DEV_USER_PASSWORD" E2E_TOTP_SECRET="$HOS_DEV_TOTP_SECRET" pnpm --filter @healthos/e2e e2e

      - name: Platform operator script works for a signed-in user
        run: |
          bash scripts/grant-operator.sh synthetic.admin@example.invalid | tee grant.txt
          grep -q "^Done" grant.txt

      - name: Verify users were provisioned in core_identity
        run: |
          n=$($COMPOSE exec -T postgres psql -U hos_superuser -d healthos -tAc "select count(*) from core_identity.user_account")
          echo "::notice title=E2E provisioning::core_identity.user_account rows = $n"
          test "$n" = "2"

      - name: Diagnostics
        if: failure()
        run: |
          echo "--- core-api"; tail -n 80 .run/core-api.log || true
          echo "--- admin-web"; tail -n 40 .run/admin-web.log || true
          grep -hiE '"LogLevel":"(Error|Critical|Warning)"|exception' .run/core-api.log | head -8 | cut -c1-900 | sed 's/^/::error title=core-api::/' || true
          $COMPOSE logs --no-color keycloak 2>/dev/null | grep -iE 'error|warn|invalid' | tail -8 | cut -c1-500 | sed 's/^/::warning title=keycloak::/' || true
          $COMPOSE ps --format '{{.Service}} {{.State}} {{.Health}}' | sed 's/^/::notice title=compose::/' || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report