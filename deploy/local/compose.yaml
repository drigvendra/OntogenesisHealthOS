# HealthOS local development stack. Synthetic data only.
# Secrets come from ../../.env (generated by scripts/dev-up.ps1, never committed).
# Image tags are pinned; verify/refresh on first pull (see docs/operations/local-dev-environment.md).
name: healthos-local

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: healthos
      POSTGRES_USER: hos_superuser
      POSTGRES_PASSWORD: ${HOS_PG_SUPERUSER_PASSWORD:?run scripts/dev-up.ps1}
    # Roles, schemas and migrations are applied by `core-api db bootstrap` / `db migrate` (see dev-up.ps1).
    # Host port 5433 avoids clashing with a natively installed PostgreSQL on 5432.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hos_superuser -d healthos"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${HOS_KEYCLOAK_ADMIN_PASSWORD:?run scripts/dev-up.ps1}
      HOS_BFF_CLIENT_SECRET: ${HOS_BFF_CLIENT_SECRET:?run scripts/dev-up.ps1}
      HOS_DEV_USER_PASSWORD: ${HOS_DEV_USER_PASSWORD:?run scripts/dev-up.ps1}
      HOS_DEV_TOTP_SECRET: ${HOS_DEV_TOTP_SECRET:?run scripts/dev-up.ps1}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The Keycloak image has no curl/grep; use only bash builtins against the management port.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          while IFS= read -r line <&3; do [[ "$$line" == *'"UP"'* ]] && exit 0; done; exit 1
      interval: 10s
      timeout: 5s
      retries: 30

  jaeger:
    image: jaegertracing/jaeger:2.5.0
    ports:
      - "127.0.0.1:16686:16686" # UI
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP

  mailpit:
    image: axllent/mailpit:v1.24.1
    ports:
      - "127.0.0.1:8025:8025" # UI
      - "127.0.0.1:1025:1025" # SMTP

volumes:
  pgdata:
